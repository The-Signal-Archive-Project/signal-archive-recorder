[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "signal-archive-recorder"
version = "0.1.1"
description = "Bit-exact receive audio and metadata recorder for ham digital modes (Signal Archive Project)"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "The Signal Archive Project contributors" }]
keywords = ["ham-radio", "amateur-radio", "ft8", "dataset", "recording"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
    "Typing :: Typed",
]
# Runtime dependencies are added stage by stage; see CLAUDE.md.
dependencies = [
    "huggingface_hub>=1.0",
    "jsonschema>=4.18",
    "keyring>=25",
    "ntplib>=0.4",
    "referencing>=0.28",
    "numpy>=1.26",
    "packaging>=23",
    "sounddevice>=0.4.7",
    "soundfile>=0.13",
]

[project.optional-dependencies]
gui = [
    "PySide6-Essentials>=6.7",  # LGPL-3.0 option; dynamically loaded (see NOTICE)
]
dev = [
    "PySide6-Essentials>=6.7",
    "pytest-qt>=4.4",
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema",
]

[project.scripts]
signal-archive-recorder = "signal_archive_recorder.cli:main"

[project.gui-scripts]
signal-archive-recorder-gui = "signal_archive_recorder.gui:main"

[project.urls]
Repository = "https://github.com/The-Signal-Archive-Project/signal-archive-recorder"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_archive_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
pythonpath = ["."]
markers = [
    "hardware: needs a real radio or sound card; skipped unless --hardware is given",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tools"]

[[tool.mypy.overrides]]
module = ["sounddevice", "soundfile", "ntplib"]
ignore_missing_imports = true
