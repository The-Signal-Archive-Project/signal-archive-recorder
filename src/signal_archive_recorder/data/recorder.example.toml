# Signal Archive Recorder configuration.
# Created by `signal-archive-recorder init`; edit freely.
# Find your device name with: signal-archive-recorder devices
# Then record with:           signal-archive-recorder record

[storage]
root = "~/SignalArchive"
max_gb = 0                   # archive size limit; only confirmed uploads are deleted; 0 = off
delete_after_days = 0        # delete confirmed uploads this many days later; 0 = never

[audio]
device = "USB Audio CODEC"   # part of the device name
sample_format = "int24"      # int16 or int24; 16-bit sound cards fit in int24 losslessly
buffer_seconds = 10
# sample_rate = 48000        # default: the device's own rate (avoids OS resampling)
# file = "reference.wav"     # play a 16/24-bit WAV instead of a device (no radio needed)
# file_speed = 1.0

[recording]
start = "with_decoder"       # record only while WSJT-X is running (otherwise wait, ready);
                             # "always" records from start to stop (e.g. with [audio] file)

[chunking]
target_seconds = 300

[station]
# callsign = "W9XYZ"
share_callsign = false       # true publishes your callsign (public, and helps attribution)
# grid = "EN52wa"
grid_precision = 4           # characters shared: 0 (withheld), 4, 6 or 8
# hf_username = "your-hf-name"

[wsjtx]
enabled = true
port = 2237
bind = "127.0.0.1"
# group = "224.0.0.1"        # multicast: share WSJT-X with GridTracker or JTAlert

[clock]
enabled = true               # checks the computer clock against NTP at start and every
interval_s = 600             # 10 minutes; never changes your clock or the recordings
# servers = ["pool.ntp.org", "time.cloudflare.com", "time.google.com"]

[upload]
repo = "signal-archive-project/signal-archive-intake"   # each session becomes one pull request
schedule = "manual"          # manual, while_recording or overnight (uploads in the background)
overnight_window = "01:00-06:00"   # local time, for schedule = "overnight"
max_mbps = 0                 # average upload cap in megabits/s; 0 = no cap

[updates]
check = true                 # daily: is a newer version out? (asks GitHub; never installs)
