name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Qt (the tray UI tests) needs these system libraries on Linux; the tests run offscreen.
      - if: runner.os == 'Linux'
        timeout-minutes: 10  # a stuck package mirror once hung this step for hours
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check
      - run: ruff format --check
      - run: mypy
      - run: pytest -m "not hardware"

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Runtime dependencies only: what we ship is what must be GPL-free.
      - run: python -m pip install .
      - run: python tools/check_licenses.py
