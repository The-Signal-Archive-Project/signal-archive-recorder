name: Windows installer

# Builds Setup.exe, installs it and smoke-tests the installed app. On a published
# release, the installer is attached to it.
on:
  pull_request:
    paths:
      - "installer/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: build and smoke-test the Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write  # attach the installer to a release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[gui]" "pyinstaller>=6.10"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - run: python installer/windows/build.py
      - run: python installer/windows/smoke_test.py (Get-ChildItem dist/*-Setup.exe).FullName
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-Setup.exe
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem dist/*-Setup.exe).FullName --clobber
